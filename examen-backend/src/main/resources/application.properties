spring.application.name=examen-backend

# Database (overridable via env; defaults suit docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/examen}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# SMTP is optional, so an unreachable mail server must not mark the service as down.
management.health.mail.enabled=false

# CORS: comma-separated browser origins allowed to call the API
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4000,http://localhost:4001,http://127.0.0.1:4200,http://127.0.0.1:4000,http://127.0.0.1:4001}

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

# JWT (required: at least 32 bytes)
app.jwt.secret=${APP_JWT_SECRET}

# Password reset
app.password-reset.max-requests=${APP_PASSWORD_RESET_MAX_REQUESTS:3}
app.password-reset.window-minutes=${APP_PASSWORD_RESET_WINDOW_MINUTES:60}
app.password-reset.token-ttl-minutes=${APP_PASSWORD_RESET_TOKEN_TTL_MINUTES:60}
app.password-reset.reset-url=${APP_PASSWORD_RESET_URL:http://localhost:4200/auth/reset}
app.password-reset.from=${APP_PASSWORD_RESET_FROM:no-reply@localhost}
app.password-reset.mail-enabled=${APP_PASSWORD_RESET_MAIL_ENABLED:true}

# Mail (optional)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

# Reminders
app.reminder.enabled=${APP_REMINDER_ENABLED:true}
app.reminder.mail-enabled=${APP_REMINDER_MAIL_ENABLED:true}
app.reminder.from=${APP_REMINDER_FROM:no-reply@localhost}
app.reminder.subject=${APP_REMINDER_SUBJECT:Your daily Examen reminder}
app.reminder.app-url=${APP_REMINDER_APP_URL:http://localhost:4200/examination}
app.reminder.in-app-title=${APP_REMINDER_IN_APP_TITLE:Daily Examen reminder}
app.reminder.in-app-message=${APP_REMINDER_IN_APP_MESSAGE:It is time for your daily examination. Open Examen to begin.}
app.reminder.cron=${APP_REMINDER_CRON:0 * * * * *}

# Gemini AI insights (optional; falls back to local heuristics when disabled or unconfigured)
app.gemini.enabled=${APP_GEMINI_ENABLED:false}
app.gemini.api-key=${APP_GEMINI_API_KEY:}
app.gemini.model=${APP_GEMINI_MODEL:gemini-2.5-flash}
app.gemini.base-url=${APP_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.gemini.timeout-seconds=${APP_GEMINI_TIMEOUT_SECONDS:8}
